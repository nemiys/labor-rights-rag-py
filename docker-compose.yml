name: labor-rights-rag

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: labor
      POSTGRES_PASSWORD: labor
      POSTGRES_DB: labor
    ports:
      - "5435:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labor -d labor"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://labor:labor@postgres:5432/labor
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgresdata:
