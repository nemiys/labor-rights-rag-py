name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    # Integration tests run against a real Postgres with pgvector, on the same port
    # and credentials as local development (see settings.py defaults).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: labor
          POSTGRES_PASSWORD: labor
          POSTGRES_DB: labor
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U labor -d labor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
